# Local compose for catalog-service (docs/11-infrastructure.md §2). Shared stores come from shared-infra/infra/local.
name: ecom-catalog

services:
  catalog-service:
    container_name: ecom-catalog
    build:
      context: ../../..
      dockerfile: catalog-service/build/Dockerfile
      args:
        TARGET: catalog-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8102}:8102"
      - "${GRPC_PORT:-9102}:9102"
    volumes:
      - ../../../secrets:/run/secrets:ro
    labels:
      logging: ecom
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [ecom_net]

  # Laravel-style CLI (docs/03 §4): docker compose run --rm catalog-service-console migrate
  catalog-service-console:
    profiles: [tools]
    build:
      context: ../../..
      dockerfile: catalog-service/build/Dockerfile
      args:
        TARGET: console
    env_file: .env
    volumes:
      - ../../../secrets:/run/secrets:ro
    networks: [ecom_net]

networks:
  ecom_net:
    external: true
