# Local compose for cart-service (docs/11-infrastructure.md §2). Shared stores come from shared-infra/infra/local.
name: ecom-cart

services:
  cart-service:
    container_name: ecom-cart
    build:
      context: ../../..
      dockerfile: cart-service/build/Dockerfile
      args:
        TARGET: cart-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8104}:8104"
      - "${GRPC_PORT:-9104}:9104"
    volumes:
      - ../../../secrets:/run/secrets:ro
    labels:
      logging: ecom
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [ecom_net]

  # Laravel-style CLI (docs/03 §4): docker compose run --rm cart-service-console migrate
  cart-service-console:
    profiles: [tools]
    build:
      context: ../../..
      dockerfile: cart-service/build/Dockerfile
      args:
        TARGET: console
    env_file: .env
    volumes:
      - ../../../secrets:/run/secrets:ro
    networks: [ecom_net]

networks:
  ecom_net:
    external: true
