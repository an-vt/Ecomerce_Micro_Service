openapi: 3.0.3
info:
  title: Ecomerce Micro Service API
  version: 0.1.0
  description: |
    Public REST API of the e-commerce platform (served by api-gateway). Every route except health, metrics and docs
    needs the `x-api-key` header. Routes marked with a lock also need `Authorization: Bearer <access token>`.
servers:
  - url: http://localhost:8088
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: x-api-key }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      properties:
        status: { type: string, example: error }
        code: { type: integer, example: 409 }
        error: { type: string, example: EMAIL_TAKEN }
        message: { type: string }
        requestId: { type: string }
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [SHOP, USER] }
        email: { type: string }
        name: { type: string }
        status: { type: string }
        verified: { type: boolean }
        hasPassword: { type: boolean }
        roles: { type: array, items: { type: string } }
    Tokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: seconds }
        sessionId: { type: string }
    AuthResult:
      type: object
      properties:
        message: { type: string }
        status: { type: integer }
        metadata:
          type: object
          properties:
            account: { $ref: '#/components/schemas/Account' }
            tokens: { $ref: '#/components/schemas/Tokens' }
    Grant:
      type: object
      required: [resource, actions]
      properties:
        resource: { type: string }
        actions: { type: array, items: { type: string, enum: [createAny, readAny, updateAny, deleteAny, createOwn, readOwn, updateOwn, deleteOwn] } }
        attributes: { type: string, default: '*' }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Ok: { description: OK, content: { application/json: { schema: { type: object } } } }
    Auth: { description: Session started, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
paths:
  /v1/api/shop/signup:
    post:
      tags: [auth]
      summary: Register a shop and sign in
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, email, password], properties: { name: { type: string }, email: { type: string }, password: { type: string, minLength: 8 } } } } } }
      responses: { '201': { $ref: '#/components/responses/Auth' }, '409': { $ref: '#/components/responses/Error' }, '400': { $ref: '#/components/responses/Error' } }
  /v1/api/shop/login:
    post:
      tags: [auth]
      summary: Shop login
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Auth' }, '401': { $ref: '#/components/responses/Error' } }
  /v1/api/shop/logout:
    post:
      tags: [auth]
      summary: End the current session
      security: [{ apiKey: [], bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Error' } }
  /v1/api/shop/handleRefreshToken:
    post:
      tags: [auth]
      summary: Rotate the refresh token (cookie `refreshToken` or body)
      requestBody: { content: { application/json: { schema: { type: object, properties: { refreshToken: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Auth' }, '401': { $ref: '#/components/responses/Error' }, '403': { description: Token reuse detected - the session was revoked, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /v1/api/user/new_user:
    post:
      tags: [auth]
      summary: Start buyer registration (sends a verification link)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Error' } }
  /v1/api/user/welcome_back:
    get:
      tags: [auth]
      summary: Complete buyer registration with the mailed token
      parameters: [{ name: token, in: query, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Auth' }, '401': { $ref: '#/components/responses/Error' } }
  /v1/api/user/password:
    post:
      tags: [auth]
      summary: Set the buyer's password
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, minLength: 8 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/Error' } }
  /v1/api/user/login:
    post:
      tags: [auth]
      summary: Buyer login
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Auth' }, '401': { $ref: '#/components/responses/Error' } }
  /v1/api/user/logout:
    post:
      tags: [auth]
      summary: End the current session
      security: [{ apiKey: [], bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /v1/api/user/handleRefreshToken:
    post:
      tags: [auth]
      summary: Rotate the refresh token (cookie `refreshToken` or body)
      requestBody: { content: { application/json: { schema: { type: object, properties: { refreshToken: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Auth' }, '401': { $ref: '#/components/responses/Error' } }
  /v1/api/rbac/role:
    post:
      tags: [rbac]
      summary: Create a role (admin)
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, slug: { type: string }, status: { type: string, enum: [active, block, pending] }, description: { type: string }, grants: { type: array, items: { $ref: '#/components/schemas/Grant' } } } } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /v1/api/rbac/roles:
    get:
      tags: [rbac]
      summary: List roles (admin)
      security: [{ apiKey: [], bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' } }
  /v1/api/rbac/resource:
    post:
      tags: [rbac]
      summary: Create a resource (admin)
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, slug: { type: string }, description: { type: string } } } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /v1/api/rbac/resources:
    get:
      tags: [rbac]
      summary: List resources (admin)
      security: [{ apiKey: [], bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' } }
  /v1/api/profile/viewAny:
    get:
      tags: [profile]
      summary: Read any account's profile (readAny:profile)
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ name: accountId, in: query, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' } }
  /v1/api/profile/viewOwn:
    get:
      tags: [profile]
      summary: Read the caller's own profile (readOwn:profile)
      security: [{ apiKey: [], bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' } }
  /v1/api/product:
    get:
      tags: [catalog]
      summary: List published products
      parameters: [{ name: page, in: query, schema: { type: integer } }, { name: limit, in: query, schema: { type: integer } }, { name: sort, in: query, schema: { type: string, enum: [ctime, price_asc, price_desc] } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [catalog]
      summary: Create a draft product (shop)
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [product_type, product_name], properties: { product_type: { type: string, enum: [Electronic, Clothing, Furniture] }, product_name: { type: string }, product_description: { type: string }, product_price: { type: integer }, product_quantity: { type: integer }, product_thumb: { type: string }, product_attributes: { type: object } } } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /v1/api/product/search/{keySearch}:
    get:
      tags: [catalog]
      summary: Full-text search of published products
      parameters: [{ name: keySearch, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /v1/api/product/{productId}:
    get:
      tags: [catalog]
      summary: A published product
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [catalog]
      summary: Partially update a product of the calling shop (attributes are merged)
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /v1/api/product/publish/{id}:
    post:
      tags: [catalog]
      summary: Publish a product (shop)
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' } }
  /v1/api/product/unpublish/{id}:
    post:
      tags: [catalog]
      summary: Unpublish a product (shop)
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' } }
  /v1/api/product/drafts/all:
    get:
      tags: [catalog]
      summary: The calling shop's draft products
      security: [{ apiKey: [], bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /v1/api/product/published/all:
    get:
      tags: [catalog]
      summary: The calling shop's published products
      security: [{ apiKey: [], bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /v1/api/product/spu/new:
    post:
      tags: [catalog]
      summary: Create an SPU with its SKUs (shop)
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [product_name, product_category], properties: { product_name: { type: string }, product_category: { type: array, items: { type: string } }, product_variations: { type: array, items: { type: object } }, sku_list: { type: array, items: { type: object } } } } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/Error' } }
  /v1/api/product/spu/get_spu_info:
    get:
      tags: [catalog]
      summary: An SPU with its SKUs
      parameters: [{ name: product_id, in: query, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } }
  /v1/api/product/sku/select_variation:
    get:
      tags: [catalog]
      summary: One SKU (cached for 30 s, unknown ids too)
      parameters: [{ name: sku_id, in: query, required: true, schema: { type: string } }, { name: product_id, in: query, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } }
  /v1/api/comment/list:
    get:
      tags: [comment]
      summary: Direct replies of a comment, or the top level
      parameters: [{ name: productId, in: query, required: true, schema: { type: string } }, { name: parentId, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer } }, { name: skip, in: query, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /v1/api/comment:
    post:
      tags: [comment]
      summary: Comment on a product or reply to a comment
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [productId, content], properties: { productId: { type: string }, content: { type: string }, parentCommentId: { type: string } } } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [comment]
      summary: Delete your comment and its replies
      security: [{ apiKey: [], bearerAuth: [] }]
      parameters: [{ name: id, in: query, required: true, schema: { type: string } }, { name: productId, in: query, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' } }
  /v1/api/inventory:
    post:
      tags: [inventory]
      summary: Add stock to one of your products (shop)
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [productId, stock], properties: { productId: { type: string }, stock: { type: integer, minimum: 1 }, location: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /v1/api/inventory/{productId}:
    get:
      tags: [inventory]
      summary: Stock of a product (available and held)
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } }
  /v1/api/cart:
    get:
      tags: [cart]
      summary: The caller's cart
      security: [{ apiKey: [], bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Error' } }
    post:
      tags: [cart]
      summary: Add a product to the caller's cart (price and name are snapshotted; stock is checked)
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [product], properties: { product: { type: object, required: [productId, quantity], properties: { productId: { type: string }, quantity: { type: integer, minimum: 1 } } } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [cart]
      summary: Remove a product from the caller's cart
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [productId], properties: { productId: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /v1/api/cart/update:
    post:
      tags: [cart]
      summary: Set several lines to absolute quantities (0 removes); all or nothing
      security: [{ apiKey: [], bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [shop_order_ids], properties: { shop_order_ids: { type: array, items: { type: object, properties: { shopId: { type: string }, item_products: { type: array, items: { type: object, required: [productId], properties: { productId: { type: string }, shopId: { type: string }, quantity: { type: integer }, old_quantity: { type: integer } } } } } } } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
