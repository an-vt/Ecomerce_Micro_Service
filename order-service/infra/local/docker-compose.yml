# Local compose for order-service (docs/11-infrastructure.md §2). Shared stores come from shared-infra/infra/local.
name: ecom-order

services:
  order-service:
    container_name: ecom-order
    build:
      context: ../../..
      dockerfile: order-service/build/Dockerfile
      args:
        TARGET: order-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8106}:8106"
      - "${GRPC_PORT:-50056}:50056"
    volumes:
      - ../../../secrets:/run/secrets:ro
    labels:
      logging: ecom
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [ecom_net]

  # Laravel-style CLI (docs/03 §4): docker compose run --rm order-service-console migrate
  order-service-console:
    profiles: [tools]
    build:
      context: ../../..
      dockerfile: order-service/build/Dockerfile
      args:
        TARGET: console
    env_file: .env
    volumes:
      - ../../../secrets:/run/secrets:ro
    networks: [ecom_net]

networks:
  ecom_net:
    external: true
