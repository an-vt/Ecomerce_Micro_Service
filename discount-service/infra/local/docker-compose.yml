# Local compose for discount-service (docs/11-infrastructure.md §2). Shared stores come from shared-infra/infra/local.
name: ecom-discount

services:
  discount-service:
    container_name: ecom-discount
    build:
      context: ../../..
      dockerfile: discount-service/build/Dockerfile
      args:
        TARGET: discount-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8105}:8105"
      - "${GRPC_PORT:-50055}:50055"
    volumes:
      - ../../../secrets:/run/secrets:ro
    labels:
      logging: ecom
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [ecom_net]

  # Laravel-style CLI (docs/03 §4): docker compose run --rm discount-service-console migrate
  discount-service-console:
    profiles: [tools]
    build:
      context: ../../..
      dockerfile: discount-service/build/Dockerfile
      args:
        TARGET: console
    env_file: .env
    volumes:
      - ../../../secrets:/run/secrets:ro
    networks: [ecom_net]

networks:
  ecom_net:
    external: true
