# Copy to .github/workflows/ci.yml to enable (kept under build/ci like the reference project).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          install-only: true
      - name: Lint (golangci-lint incl. depguard layering) + vet
        run: make lint
      - name: Unit tests + 80% coverage gate
        run: make cover
      - name: Integration tests (testcontainers; Docker is available on runners)
        run: make test-integration
      - name: Validate compose files and Prometheus rules
        run: make check-infra
