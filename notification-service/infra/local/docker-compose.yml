# Local compose for notification-service (docs/11-infrastructure.md §2). Shared stores come from shared-infra/infra/local.
name: ecom-notification

services:
  notification-service:
    container_name: ecom-notification
    build:
      context: ../../..
      dockerfile: notification-service/build/Dockerfile
      args:
        TARGET: notification-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8108}:8108"
      - "${GRPC_PORT:-9108}:9108"
    volumes:
      - ../../../secrets:/run/secrets:ro
    labels:
      logging: ecom
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [ecom_net]

  # Laravel-style CLI (docs/03 §4): docker compose run --rm notification-service-console migrate
  notification-service-console:
    profiles: [tools]
    build:
      context: ../../..
      dockerfile: notification-service/build/Dockerfile
      args:
        TARGET: console
    env_file: .env
    volumes:
      - ../../../secrets:/run/secrets:ro
    networks: [ecom_net]

networks:
  ecom_net:
    external: true
