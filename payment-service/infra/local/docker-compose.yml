# Local compose for payment-service (docs/11-infrastructure.md §2). Shared stores come from shared-infra/infra/local.
name: ecom-payment

services:
  payment-service:
    container_name: ecom-payment
    build:
      context: ../../..
      dockerfile: payment-service/build/Dockerfile
      args:
        TARGET: payment-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8107}:8107"
      - "${GRPC_PORT:-50057}:50057"
    volumes:
      - ../../../secrets:/run/secrets:ro
    labels:
      logging: ecom
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [ecom_net]

  # Laravel-style CLI (docs/03 §4): docker compose run --rm payment-service-console migrate
  payment-service-console:
    profiles: [tools]
    build:
      context: ../../..
      dockerfile: payment-service/build/Dockerfile
      args:
        TARGET: console
    env_file: .env
    volumes:
      - ../../../secrets:/run/secrets:ro
    networks: [ecom_net]

networks:
  ecom_net:
    external: true
