# Local compose for inventory-service (docs/11-infrastructure.md §2). Shared stores come from shared-infra/infra/local.
name: ecom-inventory

services:
  inventory-service:
    container_name: ecom-inventory
    build:
      context: ../../..
      dockerfile: inventory-service/build/Dockerfile
      args:
        TARGET: inventory-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8103}:8103"
      - "${GRPC_PORT:-9103}:9103"
    volumes:
      - ../../../secrets:/run/secrets:ro
    labels:
      logging: ecom
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [ecom_net]

  # Laravel-style CLI (docs/03 §4): docker compose run --rm inventory-service-console migrate
  inventory-service-console:
    profiles: [tools]
    build:
      context: ../../..
      dockerfile: inventory-service/build/Dockerfile
      args:
        TARGET: console
    env_file: .env
    volumes:
      - ../../../secrets:/run/secrets:ro
    networks: [ecom_net]

networks:
  ecom_net:
    external: true
